name: discord-release

# Posts a published release to #releases on the team's Discord server. Projects
# call it where the release becomes public: release.yml in Anvil and Etch (a
# release published with GITHUB_TOKEN starts no `release` workflow) and
# website.yml in the plugins. Run it by hand to post a release again.
#
# Needs the organization secret DISCORD_RELEASES_WEBHOOK, the URL of the webhook
# in #releases. Without it the job leaves a notice and posts nothing.
#
# #releases is an announcement channel, and a webhook cannot publish its own
# post to the servers that follow it. With DISCORD_BOT_TOKEN, the token of the
# team's bot (Manage Messages in #releases), the job publishes the post as the
# Publish button does. A failed publish leaves a warning instead of failing the
# job, so a rerun does not post the release twice.
on:
  workflow_call:
    inputs:
      tag:
        description: The published release tag
        type: string
        required: true
    secrets:
      DISCORD_RELEASES_WEBHOOK:
        required: false
      DISCORD_BOT_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: The repository of the release, e.g. happy-dwarf-team/bellows
        type: string
        required: true
      tag:
        description: The release tag, e.g. v1.3.0
        type: string
        required: true
      message:
        description: ID of a post already in #releases to publish without posting again
        type: string
        required: false

permissions: {}

jobs:
  post:
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      REPOSITORY: ${{ inputs.repository || github.repository }}
      TAG: ${{ inputs.tag }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - name: Post the release
        if: env.WEBHOOK != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [[ -n "${MESSAGE}" ]]; then
            # Publish-only run: the webhook itself says which channel the post is in.
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --output webhook.json "${WEBHOOK}"
            jq --arg id "${MESSAGE}" '{id: $id, channel_id}' webhook.json > message.json
          else
            project="${REPOSITORY##*/}"
            gh api "repos/${REPOSITORY}/releases/tags/${TAG}" > release.json
            jq --arg title "${project^} ${TAG}" '
              def notes:
                "\n" + (.body // "")
                | gsub("\r"; "")
                | sub("^\n## [^\n]*"; "")
                | gsub(" \\(\\[[0-9a-f]{7,40}\\]\\([^)]*\\)\\)"; "")
                | gsub("\n### (?<heading>[^\n]*)"; "\n**\(.heading)**")
                | gsub("\n\\* "; "\n- ")
                | gsub("\n{3,}"; "\n\n")
                | sub("^\n+"; "")
                | sub("\n+$"; "");
              # Discord takes up to 4096 characters in an embed description. Longer
              # notes are cut at the last whole line and end with a link to the release.
              def shorten($limit; $url):
                if length <= $limit then .
                else (.[:$limit] | sub("\n[^\n]*$"; "")) + "\n…\n\n[Full notes on GitHub](\($url))"
                end;
              {
                avatar_url: "https://happydwarf.dev/logo.png",
                allowed_mentions: {parse: []},
                embeds: [{
                  title: $title,
                  url: .html_url,
                  description: (.html_url as $url | notes | shorten(3800; $url)),
                  color: 16093738,
                  timestamp: .published_at
                }]
              }' release.json > payload.json
            # wait=true makes Discord return the message, whose ID the publish needs.
            if [[ "${WEBHOOK}" == *\?* ]]; then url="${WEBHOOK}&wait=true"; else url="${WEBHOOK}?wait=true"; fi
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --header 'Content-Type: application/json' \
              --data @payload.json --output message.json "${url}"
          fi

          if [[ -z "${BOT_TOKEN}" ]]; then
            echo "::notice::DISCORD_BOT_TOKEN is not set; ${REPOSITORY} ${TAG} posted but not published to followers"
            exit 0
          fi
          channel="$(jq -r '.channel_id' message.json)"
          message="$(jq -r '.id' message.json)"
          if curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --request POST --header "Authorization: Bot ${BOT_TOKEN}" \
            --output crosspost.json \
            "https://discord.com/api/v10/channels/${channel}/messages/${message}/crosspost"; then
            echo "Published message ${message} to the followers of #releases"
          else
            bot="$(curl --silent --header "Authorization: Bot ${BOT_TOKEN}" \
              https://discord.com/api/v10/users/@me | jq -r '"\(.username) (\(.id))"' 2>/dev/null || true)"
            echo "::warning::${REPOSITORY} ${TAG}: message ${message} not published by ${bot:-an unknown bot}: $(cat crosspost.json 2>/dev/null)"
          fi

      - name: Skip the post (no DISCORD_RELEASES_WEBHOOK)
        if: env.WEBHOOK == ''
        run: echo "::notice::DISCORD_RELEASES_WEBHOOK is not set; ${REPOSITORY} ${TAG} not posted"
