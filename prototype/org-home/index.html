<style>
/* Layout concept: a calm dark-forge hub; the page points outward, the cards carry the only actions. */
:root {

}
* { box-sizing: border-box; }

}

}

  <nav class="nav" aria-label="Main">

    <a class="gh" href="${GH}" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg><span class="sr-only">Happy Dwarf Team on GitHub</span></a>
  </nav>
</div></header>`;
const footer = () => `<footer class="site-footer"><div class="wrap">
  <span class="foot-brand"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#hd-glyph"/></svg>Happy Dwarf Team · MIT licensed</span>
  <span class="foot-links"><a href="${GH}/happydwarf.dev" rel="noopener">Source of this site</a><a href="${GH}" rel="noopener">GitHub organization</a></span>
  <p class="notice">Unofficial community projects. Not affiliated with or endorsed by Paradox Interactive. Europa Universalis IV is a trademark of Paradox Interactive AB. <span class="muted">(Draft wording, #14 decides.)</span></p>
</div></footer>`;

/* A: stacked groups — centred hero, each group a heading + card grid, Anvil full width on top. */
function VariantA() {
  const groups = GROUPS.map((g) => {
    const items = inGroup(g.id);
    const feat = items.filter((p) => p.featured), rest = items.filter((p) => !p.featured);
    return `<section class="group" id="${g.id}" aria-labelledby="${g.id}-h">
      <div class="group-head"><h2 id="${g.id}-h">${g.title}</h2><p class="muted">${g.intro}</p></div>
      ${feat.map(card).join('')}
      ${exampleNote(g.id)}<div class="grid${rest.length >= 3 ? ' n3' : ''}">${rest.map(card).join('')}</div>${more(g.id)}
    </section>`;
  }).join('');
  return `<div class="va">${header()}<main id="main" tabindex="-1">
    <div class="wrap">
      <section class="hero" id="top">${logo()}<span class="wordmark">HAPPY DWARF</span><h1>${H1}</h1><p class="lead">${LEAD} ${AUD}</p><a class="link" href="#projects">See the projects <span aria-hidden="true">↓</span></a></section>
      <div id="projects">${groups}</div>
      <section class="block" id="about" aria-labelledby="about-h"><h2 id="about-h">About</h2><p class="intro">${ABOUT}</p>${principles()}</section>
      <section class="block" id="get-involved" aria-labelledby="gi-h"><h2 id="gi-h">Get involved</h2>${paths()}<p class="muted">${SLOW}</p></section>
    </div></main>${footer()}</div>`;
}

/* B: ledger — left-aligned hero with big logo, each group a sticky rail + dense project rows. */
function VariantB() {
  const groups = GROUPS.map((g) => {
    const items = inGroup(g.id);
    return `<section class="group" id="${g.id}" aria-labelledby="${g.id}-h">
      <div class="rail"><h2 id="${g.id}-h">${g.title}</h2><p class="muted">${g.intro}</p><span class="count">${g.id === 'anvil-ecosystem' ? pluginTotal() + ' plugins' : items.length + ' projects'}</span></div>
      <div class="rows">${items.map((p) => `<article class="row${p.featured ? ' featured' : ''}${p.archived ? ' archived' : ''}">${icon(p, p.featured ? 44 : 32)}<h3><a href="${p.primary.href}">${p.name}</a></h3>${badge(p)}<p>${p.summary}</p>${links(p, p.featured)}</article>`).join('')}${more(g.id)}${exampleNote(g.id)}</div>
    </section>`;
  }).join('');
  return `<div class="vb">${header()}<main id="main" tabindex="-1"><div class="wrap">
    <section class="hero" id="top"><div class="text"><span class="eyebrow">Happy Dwarf Team</span><h1>${H1}</h1><p class="lead">${LEAD}</p>
      <ul class="audience" aria-label="Made for"><li>Players</li><li>Mod authors</li><li>Plugin authors</li></ul>
      <a class="link" href="#projects">See the projects <span aria-hidden="true">↓</span></a></div>${logo()}</section>
    <div id="projects">${groups}</div>
    <section class="block" id="about" aria-labelledby="about-h"><h2 id="about-h">About</h2><div class="content"><p class="intro">${ABOUT}</p>${principles()}</div></section>
    <section class="block" id="get-involved" aria-labelledby="gi-h"><h2 id="gi-h">Get involved</h2><div class="content">${paths()}<p class="muted">${SLOW}</p></div></section>
  </div></main>${footer()}</div>`;
}

/* C: ecosystem map — compact hero, Anvil as the trunk with its plugins branching off, the other two groups side by side. */
function VariantC() {
  const [anvil, ...plugins] = inGroup('anvil-ecosystem');
  const g = (id) => GROUPS.find((x) => x.id === id);
  const zoneHead = (x) => `<div class="zone-head"><h2 id="${x.id}-h">${x.title}</h2><p>${x.intro}</p></div>`;
  return `<div class="vc">${header()}<main id="main" tabindex="-1"><div class="wrap">
    <section class="hero" id="top">${logo()}<div class="text"><h1>${H1}</h1><p class="lead">${LEAD} ${AUD}</p></div><a class="link jump" href="#projects">See the projects <span aria-hidden="true">↓</span></a></section>
    <div class="map" id="projects">
      <section class="zone" id="anvil-ecosystem" aria-labelledby="anvil-ecosystem-h">${zoneHead(g('anvil-ecosystem'))}
        ${exampleNote('anvil-ecosystem')}<div class="tree${plugins.length > 4 ? ' wide' : ''}">${card(anvil).replace('<div class="body">', '').replace('</p></div>', '</p>')}
          <div class="branches"><span class="branch-label">Plugins and starters</span>${plugins.map(card).join('')}</div></div>${more('anvil-ecosystem')}
      </section>
      <div class="pair">
        <section class="zone" id="mod-tools" aria-labelledby="mod-tools-h">${zoneHead(g('mod-tools'))}<div class="stack">${inGroup('mod-tools').map(card).join('')}</div></section>
        <section class="zone" id="anbennar" aria-labelledby="anbennar-h">${zoneHead(g('anbennar'))}<div class="stack">${inGroup('anbennar').map(card).join('')}</div></section>
      </div>
    </div>
    <div class="lower">
      <section id="about" aria-labelledby="about-h"><h2 id="about-h">About</h2><p class="muted">${ABOUT}</p>${principles()}</section>
      <section id="get-involved" aria-labelledby="gi-h"><h2 id="gi-h">Get involved</h2>${paths()}<p class="muted">${SLOW}</p></section>
    </div>
  </div></main>${footer()}</div>`;
}

function Page404() {
  return `<div class="v404wrap">${header()}<main id="main" tabindex="-1"><div class="wrap"><section class="v404">
    <span class="code" aria-hidden="true">404</span><h1>This tunnel was never dug.</h1>
    <p class="muted">The page you followed does not exist. The projects are all on the home page.</p>
    <a class="btn" href="#top">Back to happydwarf.dev ${arrow}</a>
    <ul aria-label="Project groups">${GROUPS.map((x) => `<li><a class="link" href="#${x.id}">${x.title}</a></li>`).join('')}</ul>
  </section></div></main>${footer()}</div>`;
}

const VARIANTS = [
  { key: 'A', name: 'Stacked groups', render: VariantA },
  { key: 'B', name: 'Ledger (picked)', render: VariantB },
  { key: 'C', name: 'Ecosystem map', render: VariantC },
];
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const fromUrl = new URLSearchParams(location.search).get('variant') || (location.hash.match(/^#variant-([abc])$/i) || [])[1];
let idx = Math.max(0, VARIANTS.findIndex((v) => v.key === String(fromUrl || store.get('hd-proto-variant') || 'B').toUpperCase()));
let show404 = false;
let rm = store.get('hd-proto-rm') === '1';

function render() {
  const v = VARIANTS[idx];
  document.getElementById('app').innerHTML = show404 ? Page404() : v.render();
  document.getElementById('proto-label').innerHTML = `${v.key}<span class="name"> · ${v.name}</span>${show404 ? ' · 404' : ''}`;
  document.getElementById('proto-pm').textContent = PLUGIN_MODES[pm].label;
  document.getElementById('proto-404').setAttribute('aria-pressed', String(show404));
  document.getElementById('proto-rm').setAttribute('aria-pressed', String(rm));
  document.documentElement.classList.toggle('sim-rm', rm);
  store.set('hd-proto-variant', v.key);
  try { const u = new URL(location.href); u.searchParams.set('variant', v.key); history.replaceState(null, '', u); } catch {}
}
const go = (d) => { idx = (idx + d + VARIANTS.length) % VARIANTS.length; render(); };
document.getElementById('proto-prev').onclick = () => go(-1);
document.getElementById('proto-next').onclick = () => go(1);
document.getElementById('proto-pm').onclick = () => { pm = (pm + 1) % PLUGIN_MODES.length; render(); };
document.getElementById('proto-404').onclick = () => { show404 = !show404; render(); };
document.getElementById('proto-rm').onclick = () => { rm = !rm; store.set('hd-proto-rm', rm ? '1' : '0'); render(); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
/* In the prototype, "#top" links (brand, 404 button) also leave the 404 view. */
document.addEventListener('click', (e) => { const a = e.target.closest('a[href="#top"]'); if (a && show404) { show404 = false; render(); } });
render();
</script>
