<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers happy-dwarf-team/.github#13 "What do the Etch site's pages look like?"
  Three structurally different variants (A–C) plus D, the user's pick, of the etch.happydwarf.dev landing page, switchable with ?variant=A|B|C
  and the floating bar (← → keys). The bar also simulates degradation: reduced motion, slow network (video never
  arrives), and shows the demo loop's state. All media are placeholders: no ffmpeg was available, so the "demo
  loop" is an animated SVG driven by the same play/pause rules as the real <video> (issue #8). No game art.
  Not the real site: the real one is Astro, self-hosted fonts, real <video> from media.happydwarf.dev.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etch Site Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Family tokens (dark forge, #11) + Etch site accent (verdigris) */
:root {
  --forge-bg: #16171a;
  --forge-surface: #1f2024;
  --forge-surface-raised: #26272c;
  --forge-border: #34363c;
  --forge-text: #e8e6e3;
  --forge-text-muted: #a8a29e;
  --forge-accent: #4fc9a8;
  --forge-accent-strong: #7fe0c5;
  --forge-accent-soft: #11332b;
  --forge-on-accent: #16171a;
  --forge-radius: 10px;
  --forge-ease: cubic-bezier(.2, .7, .2, 1);
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: dark; } /* dark only, by family rule */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--forge-bg); color: var(--forge-text); font: 16px/1.6 var(--sans); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
.sim-rm * { transition: none !important; }
a { color: var(--forge-accent-strong); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--forge-accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--mono); letter-spacing: -.02em; line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: clamp(1.9rem, 4.2vw + .5rem, 3.2rem); }
h2 { font-size: clamp(1.4rem, 2vw + .6rem, 2rem); }
h3 { font-size: 1.05rem; }
p { margin: 0 0 1em; }
code, kbd { font-family: var(--mono); font-size: .9em; background: var(--forge-surface-raised); border: 1px solid var(--forge-border); border-radius: 5px; padding: .05em .35em; }
.muted { color: var(--forge-text-muted); }
.wrap { width: min(1160px, 100% - 32px); margin-inline: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
section { padding: clamp(48px, 7vw, 88px) 0; }
.eyebrow { font: 700 .78rem var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--forge-accent); margin-bottom: .6em; }

/* header / footer */
.site-head { border-bottom: 1px solid var(--forge-border); }
.site-head .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--forge-text); text-decoration: none; font: 700 1.05rem var(--mono); letter-spacing: .08em; }
.brand svg { width: 32px; height: 32px; color: var(--forge-accent); }
.site-head nav { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
.site-head nav a { color: var(--forge-text-muted); text-decoration: none; padding: 10px 10px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 6px; }
.site-head nav a:hover { color: var(--forge-text); background: var(--forge-surface); }
.badge { display: inline-flex; align-items: center; gap: 6px; font: 500 .78rem var(--mono); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--forge-accent); color: var(--forge-accent-strong); background: var(--forge-accent-soft); white-space: nowrap; }
.site-foot { border-top: 1px solid var(--forge-border); padding: 36px 0 120px; font-size: .9rem; color: var(--forge-text-muted); }
.site-foot .wrap { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .site-foot .wrap { grid-template-columns: 1fr auto; align-items: start; } }
.family { display: inline-flex; align-items: center; gap: 8px; color: var(--forge-text); text-decoration: none; }
.family .dwarf { width: 24px; height: 24px; border-radius: 6px; background: #f5922a; color: #16171a; display: grid; place-items: center; font: 700 .7rem var(--mono); }
.foot-links { display: flex; gap: 16px; flex-wrap: wrap; }

/* buttons */
.btns { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: var(--forge-radius); font: 600 1rem var(--sans); text-decoration: none; border: 1px solid var(--forge-border); color: var(--forge-text); background: var(--forge-surface); transition: transform 180ms var(--forge-ease), border-color 180ms var(--forge-ease); }
.btn:hover { border-color: var(--forge-accent); transform: translateY(-2px); }
.btn.primary { background: var(--forge-accent); color: var(--forge-on-accent); border-color: var(--forge-accent); }
.btn.primary:hover { background: var(--forge-accent-strong); }
.btn small { font: 500 .75rem var(--mono); opacity: .8; }
.btn .stack { display: flex; flex-direction: column; line-height: 1.15; padding: 6px 0; }
@media (prefers-reduced-motion: reduce) { .btn, .card { transition: none; } .btn:hover, .card:hover { transform: none; } }
.sim-rm .btn:hover, .sim-rm .card:hover { transform: none; }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--forge-surface); border: 1px solid var(--forge-border); border-radius: 8px; padding: 6px 6px 6px 14px; font: 500 .88rem var(--mono); max-width: 100%; }
.cmd span { overflow-x: auto; white-space: nowrap; flex: 1; scrollbar-width: thin; }
.cmd button { min-height: 36px; min-width: 64px; border-radius: 6px; border: 1px solid var(--forge-border); background: var(--forge-surface-raised); color: var(--forge-text); font: 500 .8rem var(--sans); cursor: pointer; }

/* demo loop (stands in for <video muted loop playsinline preload="none" poster>) */
.loop { margin: 0; }
.loop-frame { position: relative; aspect-ratio: 16 / 9; border-radius: var(--forge-radius); overflow: hidden; border: 1px solid var(--forge-border); background: #111214; box-shadow: 0 24px 60px -30px rgb(0 0 0 / .8); }
.loop-frame svg { display: block; width: 100%; height: 100%; }
.loop-frame .anim { position: absolute; inset: 0; opacity: 0; transition: opacity 250ms; }
.loop.is-playing .anim, .loop.is-paused .anim { opacity: 1; }
.loop .anim * { animation-play-state: paused !important; }
.loop.is-playing .anim * { animation-play-state: running !important; }
.loop-ctl { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: center; }
.loop-btn { min-height: 44px; min-width: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .18); background: rgb(22 23 26 / .86); color: var(--forge-text); font: 600 .85rem var(--sans); cursor: pointer; backdrop-filter: blur(4px); }
.loop-btn:hover { border-color: var(--forge-accent); }
.loop-btn svg { width: 14px; height: 14px; }
.loop-btn[disabled] { opacity: .75; cursor: progress; }
.loop figcaption { margin-top: 10px; font-size: .9rem; color: var(--forge-text-muted); }
.loop figcaption b { color: var(--forge-text); font-weight: 600; }
.loop-note { position: absolute; left: 10px; bottom: 10px; font: 500 .75rem var(--mono); background: rgb(22 23 26 / .86); padding: 4px 8px; border-radius: 6px; color: var(--forge-text-muted); }

/* placeholder svg animation */
@keyframes caret { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(0); } 30%, 55% { transform: translateY(66px); } 60%, 95% { transform: translateY(132px); } }
@keyframes grow { 0%, 25% { width: 300px; } 32%, 58% { width: 420px; } 64%, 100% { width: 360px; } }
@keyframes flash { 0%, 26% { opacity: 0; } 28% { opacity: 1; } 40% { opacity: 0; } 58% { opacity: 0; } 61% { opacity: 1; } 75%, 100% { opacity: 0; } }
@keyframes typing { 0%, 22% { width: 0; } 28%, 100% { width: 180px; } }
.a-caret { animation: caret 8s infinite steps(1); }
.a-grow { animation: grow 8s infinite var(--forge-ease); }
.a-flash { animation: flash 8s infinite; }
.a-type { animation: typing 8s infinite steps(12); }

/* cards and grids */
.grid { display: grid; gap: 16px; }
@media (min-width: 640px) { .grid.c2 { grid-template-columns: repeat(2, 1fr); } .grid.c3 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .grid.c3 { grid-template-columns: repeat(3, 1fr); } }
.card { background: var(--forge-surface); border: 1px solid var(--forge-border); border-radius: var(--forge-radius); padding: 20px; transition: transform 180ms var(--forge-ease), border-color 180ms var(--forge-ease); }
.card p:last-child { margin-bottom: 0; }
.card .ico { width: 28px; height: 28px; color: var(--forge-accent); margin-bottom: 10px; }
.card h3 { margin-bottom: .35em; }
.facts { display: flex; gap: 8px 18px; flex-wrap: wrap; font: 500 .85rem var(--mono); color: var(--forge-text-muted); padding: 0; margin: 14px 0 0; list-style: none; }
.facts li::before { content: "· "; color: var(--forge-accent); }
.limits { border-left: 3px solid var(--forge-accent); background: var(--forge-surface); padding: 16px 20px; border-radius: 0 var(--forge-radius) var(--forge-radius) 0; }
.limits ul { margin: 0; padding-left: 1.1em; }

/* gallery A: thumbnail grid + dialog */
.thumbs { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .thumbs { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .thumbs { grid-template-columns: repeat(3, 1fr); } }
.thumb { all: unset; cursor: zoom-in; display: block; width: 100%; border-radius: var(--forge-radius); }
.thumb:focus-visible { outline: 2px solid var(--forge-accent); outline-offset: 3px; }
.thumb .shot { border: 1px solid var(--forge-border); border-radius: var(--forge-radius); overflow: hidden; aspect-ratio: 16/9; transition: border-color 180ms; }
.thumb:hover .shot { border-color: var(--forge-accent); }
.thumb .shot svg { display: block; width: 100%; height: 100%; }
.thumb span { display: block; padding-top: 8px; font-size: .9rem; color: var(--forge-text-muted); }
dialog.lightbox { width: min(1400px, 100vw - 24px); max-height: calc(100vh - 24px); padding: 0; border: 1px solid var(--forge-border); border-radius: var(--forge-radius); background: var(--forge-bg); color: var(--forge-text); }
dialog.lightbox::backdrop { background: rgb(0 0 0 / .8); }
.lb-body svg { display: block; width: 100%; height: auto; }
.lb-bar { display: flex; gap: 8px; align-items: center; padding: 10px; border-top: 1px solid var(--forge-border); flex-wrap: wrap; }
.lb-bar p { margin: 0 auto 0 6px; flex: 1 1 200px; font-size: .9rem; }
.lb-bar button { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--forge-border); background: var(--forge-surface); color: var(--forge-text); font: 600 .9rem var(--sans); cursor: pointer; }

/* install steps */
.steps { counter-reset: s; display: grid; gap: 16px; padding: 0; margin: 0; list-style: none; }
@media (min-width: 900px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.steps > li { counter-increment: s; background: var(--forge-surface); border: 1px solid var(--forge-border); border-radius: var(--forge-radius); padding: 20px; min-width: 0; }
.steps > li::before { content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--forge-accent-soft); color: var(--forge-accent-strong); font: 700 .95rem var(--mono); margin-bottom: 10px; }

/* roadmap vertical (A) */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline li { position: relative; padding: 0 0 26px 34px; }
.timeline li::before { content: ""; position: absolute; left: 7px; top: 22px; bottom: -4px; width: 2px; background: var(--forge-border); }
.timeline li:last-child::before { display: none; }
.timeline .dot { position: absolute; left: 0; top: 4px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--forge-border); background: var(--forge-bg); }
.timeline .done .dot { background: var(--forge-accent); border-color: var(--forge-accent); }
.timeline .now .dot { border-color: var(--forge-accent); box-shadow: 0 0 0 4px var(--forge-accent-soft); }
.timeline h3 { margin: 0 0 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.timeline .state { font: 500 .75rem var(--mono); color: var(--forge-text-muted); text-transform: uppercase; letter-spacing: .08em; }
.timeline .done .state, .timeline .now .state { color: var(--forge-accent-strong); }
.timeline p { margin: 0; color: var(--forge-text-muted); }

/* B: split hero, feature tour, horizontal track */
.split { display: grid; gap: 32px; align-items: center; }
@media (min-width: 980px) { .split { grid-template-columns: 5fr 7fr; } }
.tour { display: grid; gap: clamp(40px, 6vw, 72px); }
.tour-row { display: grid; gap: 20px; align-items: center; }
@media (min-width: 860px) { .tour-row { grid-template-columns: 1fr 1.4fr; gap: 40px; } .tour-row:nth-child(even) > :first-child { order: 2; } }
.tour-row .shot { border: 1px solid var(--forge-border); border-radius: var(--forge-radius); overflow: hidden; aspect-ratio: 16/9; }
.tour-row .shot svg { display: block; width: 100%; height: 100%; }
.tour-row figure { margin: 0; }
.tour-row figcaption { font-size: .85rem; color: var(--forge-text-muted); margin-top: 6px; }
.band { background: var(--forge-surface); border-block: 1px solid var(--forge-border); }
.track { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
@media (min-width: 900px) { .track { grid-template-columns: repeat(6, 1fr); gap: 0; } }
.track li { position: relative; padding: 14px; border: 1px solid var(--forge-border); border-radius: var(--forge-radius); background: var(--forge-bg); }
@media (min-width: 900px) {
  .track li { border-radius: 0; border-right-width: 0; padding-top: 34px; }
  .track li:first-child { border-radius: var(--forge-radius) 0 0 var(--forge-radius); }
  .track li:last-child { border-radius: 0 var(--forge-radius) var(--forge-radius) 0; border-right-width: 1px; }
  .track li::before { content: ""; position: absolute; top: 14px; left: 14px; right: 0; height: 4px; background: var(--forge-border); border-radius: 2px; }
  .track li.done::before, .track li.now::before { background: var(--forge-accent); }
  .track li.now::before { right: 50%; }
}
.track b { display: block; font: 700 .95rem var(--mono); }
.track .ver { font: 500 .78rem var(--mono); color: var(--forge-accent-strong); }
.track p { margin: 6px 0 0; font-size: .85rem; color: var(--forge-text-muted); }

/* C: docs shell */
.docs { display: grid; gap: 0; }
@media (min-width: 900px) { .docs { grid-template-columns: 240px minmax(0, 1fr); } }
.docs aside { border-right: 1px solid var(--forge-border); padding: 24px 16px; }
@media (max-width: 899px) { .docs aside { border-right: 0; border-bottom: 1px solid var(--forge-border); padding: 8px 16px; } }
.docs aside ul { list-style: none; margin: 0; padding: 0; }
@media (max-width: 899px) { .docs aside ul { display: flex; gap: 4px; overflow-x: auto; } }
.docs aside a { display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 6px; color: var(--forge-text-muted); text-decoration: none; white-space: nowrap; }
.docs aside a[aria-current="page"] { background: var(--forge-accent-soft); color: var(--forge-accent-strong); }
.docs main { padding: 32px clamp(16px, 4vw, 48px) 0; max-width: 820px; }
.docs main section { padding: 0 0 40px; }
.docs .shot { border: 1px solid var(--forge-border); border-radius: var(--forge-radius); overflow: hidden; aspect-ratio: 16/9; }
.docs .shot svg { display: block; width: 100%; height: 100%; }
.docs figure { margin: 0 0 28px; }
.docs figcaption { font-size: .9rem; color: var(--forge-text-muted); margin-top: 6px; }
.docs table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.docs th, .docs td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--forge-border); vertical-align: top; }


/* D: zoomable tour shots + actual-size lightbox */
.zoom { all: unset; display: block; width: 100%; position: relative; cursor: zoom-in; border-radius: var(--forge-radius); }
.zoom:focus-visible { outline: 2px solid var(--forge-accent); outline-offset: 3px; }
.zoom:hover .shot { border-color: var(--forge-accent); }
.zoom-hint { position: absolute; right: 10px; bottom: 10px; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 999px; background: rgb(22 23 26 / .86); border: 1px solid rgb(255 255 255 / .18); font: 600 .8rem var(--sans); color: var(--forge-text); }
.zoom-hint svg { width: 14px; height: 14px; }
.lb-body { overflow: auto; max-height: calc(100vh - 110px); }
.lb-body.actual svg { width: 1600px; max-width: none; }

/* prototype switcher: deliberately NOT dark forge */
.proto { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); padding: 6px 8px; border-radius: 16px; background: #fff7c2; color: #111; box-shadow: 0 8px 30px rgb(0 0 0 / .6); font: 600 13px/1.2 system-ui, sans-serif; border: 2px solid #111; }
.proto button { min-height: 36px; min-width: 36px; border-radius: 10px; border: 1px solid #111; background: #fff; color: #111; font: 600 13px system-ui, sans-serif; cursor: pointer; padding: 0 10px; }
.proto button[aria-pressed="true"] { background: #111; color: #fff7c2; }
.proto .lbl { padding: 0 6px; white-space: nowrap; }
.proto .state { font: 500 12px ui-monospace, monospace; background: #111; color: #9ff2d8; padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
.proto .x { display: none; }
@media (max-width: 640px) { .proto { flex-wrap: nowrap; } .proto.open { flex-wrap: wrap; } .proto .lbl { max-width: 150px; overflow: hidden; text-overflow: ellipsis; } }
@media (max-width: 640px) { .proto .opt { display: none; } .proto.open .opt { display: inline-flex; } .proto .x { display: inline-flex; } }
</style>
</head>
<body>
<div id="app"></div>
<dialog class="lightbox" id="lb" aria-labelledby="lb-cap">
  <div class="lb-body" id="lb-body"></div>
  <div class="lb-bar">
    <p id="lb-cap"></p>
    <button type="button" id="lb-actual" aria-pressed="false">Actual size</button>
    <button type="button" id="lb-prev">Previous</button>
    <button type="button" id="lb-next">Next</button>
    <button type="button" id="lb-close">Close</button>
  </div>
</dialog>
<div class="proto" id="proto" role="region" aria-label="Prototype controls (not part of the design)">
  <button type="button" id="p-prev" aria-label="Previous variant">←</button>
  <span class="lbl" id="p-lbl"></span>
  <button type="button" id="p-next" aria-label="Next variant">→</button>
  <button type="button" class="x" id="p-more" aria-expanded="false">Sim</button>
  <button type="button" class="opt" id="p-rm" aria-pressed="false">Reduced motion</button>
  <button type="button" class="opt" id="p-slow" aria-pressed="false">Slow network</button>
  <button type="button" class="opt" id="p-save" aria-pressed="false">Save-Data</button>
  <span class="state opt" id="p-state" aria-live="polite">loop: —</span>
</div>

<script>
// ---------- content (from etch README, extension README, spec v1) ----------
const MARKET = "https://marketplace.visualstudio.com/items?itemName=happy-dwarf-team.etch";
const OVSX = "https://open-vsx.org/extension/happy-dwarf-team/etch";
const REPO = "https://github.com/happy-dwarf-team/etch";
const CMD = "code --install-extension happy-dwarf-team.etch";

const FEATURES = [
  { t: "Preview as you type", d: "The preview follows the unsaved editor buffer on every change, including the mod's <code>.gfx</code> and localisation files. Warm reload: median 6–7 ms, p95 8–14 ms <span class='muted'>(measured on the maintainer's machine, etch#39)</span>.", i: "bolt" },
  { t: "The window under the cursor", d: "The preview shows the top-level window that holds the cursor. <b>Pin</b> keeps it on one window while you edit other files.", i: "win" },
  { t: "Widget outline and jump to source", d: "The Widget Outline lists the window's widgets. Click a widget in the preview to reveal its source; hover to see its path and rect.", i: "tree" },
  { t: "Diagnostics in Problems", d: "Missing sprites, fonts and textures, duplicate names and more appear in VS Code's Problems panel as you edit.", i: "warn" },
  { t: "Any resolution", d: "The game's <code>settings.txt</code>, the monitor's, a corpus resolution from 1280×720 to 3440×1440 or any width × height. <code>if_resolution</code> blocks follow it.", i: "res" },
  { t: "Your playset, the game's own art", d: "Etch finds the game through Steam and draws with its textures, fonts and localisation. It ships none of them and sends nothing anywhere.", i: "lock" },
];
const SHOTS = [
  { k: "preview", t: "A .gui file and its window side by side", d: "Editor on the left, Etch's preview on the right, the widget at the cursor outlined." },
  { k: "outline", t: "Widget Outline and jump to source", d: "The Widget Outline in the Explorer; clicking a widget in the preview reveals its line." },
  { k: "problems", t: "Diagnostics in the Problems panel", d: "A missing sprite reported in Problems while the preview keeps drawing." },
  { k: "res", t: "Choosing the preview resolution", d: "The resolution picker with the corpus resolutions and a custom size." },
  { k: "pin", t: "A pinned window", d: "The preview stays on a pinned window while a .gfx file is edited." },
  { k: "loc", t: "Localisation in the preview", d: "Static localised text drawn with the game's fonts, switched with etch.language." },
];
const ROADMAP = [
  { m: "M0", n: "Foundation", v: "—", s: "done", p: "Public repository, CI, release-please, packaged VSIX." },

const LOOP_TEXT = "A <code>.gui</code> file is open on the left. A button's size is changed in the editor and the window on the right redraws at once; the edited widget stays outlined.";

const SIM = { rm: false, slow: false, save: false };
function saveData() { return SIM.save || !!navigator.connection?.saveData; }
const loops = new Map();
function reducedMotion() { return SIM.rm || matchMedia("(prefers-reduced-motion: reduce)").matches; }
function setLoopState(el, st) {
  const s = loops.get(el); s.state = st;
  el.classList.toggle("is-playing", st === "playing");
  el.classList.toggle("is-paused", st === "paused" || st === "offscreen");
  const btn = el.querySelector(".loop-btn"), note = el.querySelector(".loop-note");
  btn.disabled = st === "loading";
  btn.innerHTML = st === "playing" ? `${PAUSE}<span>Pause</span>` : st === "loading" ? `<span>Loading…</span>` : `${PLAY}<span>Play</span>`;
  note.hidden = !(st === "poster-rm" || st === "poster-save" || st === "loading" || st === "stalled");
  note.textContent = st === "poster-rm" ? "Reduced motion: poster shown" : st === "poster-save" ? "Data saver on: press Play" : st === "loading" ? "Loading video…" : st === "stalled" ? "Video unavailable — poster and description stay" : "";
  renderState();
}
function tryPlay(el) {
  const s = loops.get(el);
  if (s.loaded) return setLoopState(el, "playing");
  setLoopState(el, "loading");
  clearTimeout(s.t);
  // slow network: the video never arrives; the poster and the text stay. Normal: ~300 ms.
  s.t = setTimeout(() => { if (SIM.slow) setLoopState(el, "stalled"); else { s.loaded = true; if (s.visible && !s.userPaused) setLoopState(el, "playing"); else setLoopState(el, "paused"); } }, SIM.slow ? 4000 : 300);
}
function decide(el) {
  const s = loops.get(el);
  if (s.userPaused) return setLoopState(el, s.loaded ? "paused" : "poster");
  if (reducedMotion() && !s.userPlayed) return setLoopState(el, "poster-rm");
  if (saveData() && !s.userPlayed) return setLoopState(el, "poster-save");
  if (!s.visible) return setLoopState(el, s.loaded ? "offscreen" : "poster");
  if (s.state === "stalled") return;
  tryPlay(el);
}
function initLoops() {
  loops.clear();
  const io = new IntersectionObserver(es => es.forEach(e => { const s = loops.get(e.target); if (!s) return; s.visible = e.intersectionRatio >= .5; decide(e.target); }), { threshold: [0, .5, 1] });
  document.querySelectorAll("[data-loop]").forEach(el => {
    loops.set(el, { state: "poster", visible: false, loaded: false, userPaused: false, userPlayed: false });
    el.querySelector(".loop-btn").addEventListener("click", () => {
      const s = loops.get(el);
      if (s.state === "playing") { s.userPaused = true; s.userPlayed = false; setLoopState(el, "paused"); }
      else { s.userPaused = false; s.userPlayed = true; if (s.state === "stalled") s.state = "poster"; tryPlay(el); }
    });
    io.observe(el);
  });
}

      <div class="eyebrow">EU4 interface mods · VS Code</div>
      <h1>Edit the <code style="font-size:.8em">.gui</code>. Watch the window.</h1>
      <p class="muted" style="font-size:1.1rem">Etch draws the window under your cursor from the unsaved buffer, with the game's own art, in milliseconds.</p>
      ${storeBtns(true)}${reqs}
    </div>
    ${loop("hero-loop", LOOP_TEXT)}
  </div></section>
  <section class="band" id="install" style="padding:32px 0"><div class="wrap" style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:center">
    <div><h2 style="font-size:1.2rem;margin:0">Install in one line</h2><p class="muted" style="margin:0">Then open a <code>.gui</code> and run <b>Etch: Open Preview</b>. The full guide is in the <a href="${REPO}/blob/main/packages/extension/README.md">extension README</a>.</p></div>
    ${cmd()}
  </div></section>
  <section id="features"><div class="wrap"><div class="eyebrow">In 0.1.0</div><h2>What the offline preview does</h2><div class="tour" style="margin-top:32px">${tour}</div><div style="margin-top:48px">${limitsBox()}</div></div></section>
  <section id="roadmap" style="padding-top:0"><div class="wrap" style="max-width:760px">
    <div class="eyebrow">Status</div><h2>Preview now, 1.0.0 later</h2>
    <p class="muted">Etch is a preview release. The plan for 1.0.0 is the <a href="${REPO}/blob/main/docs/spec/v1.md">v1 specification</a>; version numbers are indicative.</p>
    <ol class="timeline">${ROADMAP.map(r => `<li class="${r.s}"><span class="dot" aria-hidden="true"></span><h3>${r.m} · ${r.n} <span class="state">${r.s === "done" ? "done" : r.s === "now" ? "released · " + r.v : r.v}</span></h3><p>${r.p}</p></li>`).join("")}</ol>
  </div></section>
</main>${footer()}`;
}

// ---------- switcher ----------
const VARIANTS = [["A", "Centred product page", VariantA], ["B", "Split hero + feature tour", VariantB], ["C", "Docs shell (Starlight-like)", VariantC], ["D", "Pick: B hero + zoomable tour, A timeline", VariantD]];
const qs = new URLSearchParams(location.search);
let vi = Math.max(0, VARIANTS.findIndex(v => v[0] === (qs.get("variant") || "A").toUpperCase()));
SIM.rm = qs.get("rm") === "1"; SIM.slow = qs.get("slow") === "1"; SIM.save = qs.get("save") === "1";
function syncUrl() {
  const p = new URLSearchParams(); p.set("variant", VARIANTS[vi][0]); if (SIM.rm) p.set("rm", "1"); if (SIM.slow) p.set("slow", "1"); if (SIM.save) p.set("save", "1");
  try { history.replaceState(null, "", "?" + p + location.hash); } catch {}
}
function renderState() {
  const parts = [...loops.values()].map(s => s.state);
  document.getElementById("p-state").textContent = `loop: ${parts.join(",") || "—"} · os-rm:${matchMedia("(prefers-reduced-motion: reduce)").matches ? "on" : "off"} · ${innerWidth}px`;
}
function render() {
  const [k, name, fn] = VARIANTS[vi];
  document.getElementById("app").innerHTML = fn();
  document.getElementById("p-lbl").textContent = `${k} · ${name}`;
  document.documentElement.classList.toggle("sim-rm", SIM.rm);
  document.getElementById("p-rm").setAttribute("aria-pressed", SIM.rm);
  document.getElementById("p-slow").setAttribute("aria-pressed", SIM.slow);
  document.getElementById("p-save").setAttribute("aria-pressed", SIM.save);
  syncUrl(); initLoops(); renderState();
}
function go(d) { vi = (vi + d + VARIANTS.length) % VARIANTS.length; try { history.replaceState(null, "", location.pathname + location.search); } catch {} render(); scrollTo(0, 0); }
document.getElementById("p-prev").onclick = () => go(-1);
document.getElementById("p-next").onclick = () => go(1);
document.getElementById("p-rm").onclick = () => { SIM.rm = !SIM.rm; render(); };
document.getElementById("p-slow").onclick = () => { SIM.slow = !SIM.slow; render(); };
document.getElementById("p-save").onclick = () => { SIM.save = !SIM.save; render(); };
document.getElementById("p-more").onclick = e => { const o = document.getElementById("proto").classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]") || document.querySelector("dialog[open]")) return;
  if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1);
});
addEventListener("hashchange", () => { if (VARIANTS[vi][0] === "C") { render(); } });
addEventListener("resize", renderState);
matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", () => loops.forEach((_, el) => decide(el)));
document.addEventListener("visibilitychange", () => loops.forEach((s, el) => { if (document.hidden && s.state === "playing") setLoopState(el, "offscreen"); else decide(el); }));

// copy buttons + lightbox (variant A)
const lb = document.getElementById("lb"); let lbi = 0, lbFrom = null;
const lbOrder = () => VARIANTS[vi][0] === "D" ? D_ORDER : SHOTS.map((_, i) => i);
function showShot(i) { lbi = (i + SHOTS.length) % SHOTS.length; const s = SHOTS[lbOrder()[lbi]]; document.getElementById("lb-body").innerHTML = shot(s.t, s.k); document.getElementById("lb-cap").innerHTML = `<b>${s.t}.</b> ${s.d} <span class="muted">(${lbi + 1} of ${SHOTS.length})</span>`; }
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]"); if (c) { Promise.resolve(navigator.clipboard?.writeText(c.dataset.copy)).catch(() => getSelection().selectAllChildren(c.previousElementSibling)); c.textContent = "Copied"; setTimeout(() => c.textContent = "Copy", 1500); }
  const t = e.target.closest("[data-shot]"); if (t) { lbFrom = t; showShot(+t.dataset.shot); lb.showModal(); document.getElementById("lb-close").focus(); }
});
document.getElementById("lb-prev").onclick = () => showShot(lbi - 1);
document.getElementById("lb-next").onclick = () => showShot(lbi + 1);
document.getElementById("lb-close").onclick = () => lb.close();
document.getElementById("lb-actual").onclick = e => { const on = document.getElementById("lb-body").classList.toggle("actual"); e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "Fit to screen" : "Actual size"; };
lb.addEventListener("close", () => lbFrom?.focus());
lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") showShot(lbi - 1); if (e.key === "ArrowRight") showShot(lbi + 1); });
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
render();
</script>
</body>
</html>
